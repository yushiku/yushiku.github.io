bio:
  en:
  - Yoshitaka Ushiku is Chief Executive Officer at NexaScience, Inc. and Vice President for Research at OMRON SINIC X.
  - He received his B.E., M.A., and Ph.D. degrees from the University of Tokyo in 2009, 2011, and 2014, respectively.
  - In 2014, he joined NTT CS Labs, Japan, where he was involved in research on image recognition.
  - From 2016 to 2018, he was a Lecturer at the University of Tokyo, Japan.
  - He has held both positions since 2024.
  - He has also been Team Director at RIKEN TRIP-AGIS since 2025 and the managing partner of Nine Bulls, LLC since 2022.
  - His research interests lie in cross-media understanding through machine learning, mainly for computer vision and natural language processing.
  - He received ACM Multimedia Grand Challenge Special Prize in 2011, ACM Multimedia Open Source Software Competition Honorable Mention in 2017, NVIDIA Pioneering Research Awards in 2017 and 2018, the Yamato Science Award in 2021, and NISTEP Nice Step Researcher in 2023.
  ja:
  - 2013年日本学術振興会特別研究員およびMicrosoft Research Redmond Intern。
  - 2014年東京大学大学院情報理工学系研究科博士課程修了、NTTコミュニケーション科学基礎研究所入所。
  - 2016年東京大学情報理工学系研究科講師。
  - 2018年よりオムロンサイニックエックス株式会社 Principal Investigator。
  - 2019年より株式会社Ridge-i Chief Research Officer、2022年より合同会社ナインブルズ代表、2024年よりオムロンサイニックエックス株式会社 リサーチバイスプレジデント、株式会社NexaScience 代表取締役、2025年より理化学研究所 TRIP-AGIS チームディレクター、現在に至る。
  - 主としてコンピュータビジョンや自然言語処理を対象として、機械学習によるクロスメディア理解やAIロボット駆動科学の研究に従事。
  - 2011年ACM Multimedia Grand Challenge Special Prize受賞、2017年ACM Multimedia Open Source Software Competition Honorable Mention選出、2017年および2018年NVIDIA Pioneering Research Awards受賞、2021年ヤマト科学賞受賞、2023年NISTEPナイスステップな研究者選出。
